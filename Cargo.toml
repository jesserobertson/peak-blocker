[package]
name = "peak-blocker"
version = "0.1.1"
edition = "2021"
description = "A Claude Code PreToolUse hook that pauses tool calls during Anthropic's weekday peak window."
license = "MIT"
repository = "https://github.com/jesserobertson/peak-blocker"
readme = "README.md"

[dependencies]
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
